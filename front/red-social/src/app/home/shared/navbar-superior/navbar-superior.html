<header class="w-full h-[40px] bg-black border-b border-emerald-950/80 px-4 flex items-center justify-between relative z-50 select-none shadow-gothic">

  <div class="flex items-center gap-1 text-[10px] font-mono text-gray-600 tracking-widest uppercase">
    <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500/40 animate-pulse"></span>
    <span>CREDENCIALES ACTIVAS</span>
  </div>

  <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 flex items-center gap-2 cursor-pointer" routerLink="/home">
    <div class="logo-container flex items-center justify-center">
      <span class="text-xs filter drop-shadow-[0_0_3px_#10b981]">👁️</span>
      </div>
    <h1 class="font-logo text-emerald-400 text-xs tracking-[0.2em] uppercase drop-shadow-[0_0_4px_rgba(16,185,129,0.5)]">
      Paranormal Social Network
    </h1>
  </div>

  <div class="flex items-center gap-3 h-full">

    <div routerLink="/home/edit-profile"
         class="flex items-center gap-2 h-full cursor-pointer group px-2 hover:bg-emerald-950/20 transition-colors">

      <div class="w-5 h-5 rounded-full bg-black border border-emerald-500/40 flex items-center justify-center font-bold text-emerald-400 text-[9px] overflow-hidden transition-all group-hover:border-emerald-400 group-hover:shadow-[0_0_5px_rgba(16,185,129,0.4)]">
       @if (currentUser.avatarUrl || currentUser.avatarUrl) {
              <img [src]="'http://localhost:3000' + (currentUser.avatarUrl || currentUser.avatarUrl)" class="w-full h-full object-cover" alt="Avatar">
            } @else {
              <span class="text-2xl">👁️</span>
            }
      </div>

      <span class="text-[9px] font-mono text-gray-400 group-hover:text-emerald-400 tracking-wider uppercase transition-colors hidden sm:inline">
        Configurar Perfil
      </span>
    </div>

    <span class="text-gray-800 text-xs">|</span>

    <button (click)="authService.cerrarSesion()"
            class="text-[9px] font-mono bg-transparent hover:bg-red-950/30 text-gray-500 hover:text-red-400 px-2 py-0.5 rounded border border-transparent hover:border-red-900/40 uppercase tracking-widest transition-all cursor-pointer">
      Cerrar Sesión
    </button>
  </div>
</header>
