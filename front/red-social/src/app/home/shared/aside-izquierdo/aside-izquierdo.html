<div class="h-full flex flex-col justify-between p-2">

  <div class="space-y-6">
    <div>
      <h1 class="font-logo text-emerald-500 text-2xl tracking-widest uppercase drop-shadow-[0_0_8px_rgba(16,185,129,0.4)]">
        Paranormal
      </h1>
      <span class="text-xs text-gray-400 uppercase tracking-wider block -mt-1">Social Network</span>
    </div>

    <nav class="space-y-1">

      <a routerLink="/home"
         routerLinkActive="text-emerald-400 font-bold bg-emerald-950/30 border-l-2 border-emerald-500 rounded-r-md"
         [routerLinkActiveOptions]="{ exact: true }"
         class="flex items-center gap-4 px-4 py-3 text-gray-400 hover:text-emerald-400 hover:bg-white/5 rounded-md transition-all text-sm uppercase tracking-wide">
        <svg lucideSmile color="#3e9212" /> <span>Home</span>
      </a>

      <a routerLink="/home/my-profile"
         routerLinkActive="text-emerald-400 font-bold bg-emerald-950/30 border-l-2 border-emerald-500 rounded-r-md"
         class="flex items-center gap-4 px-4 py-3 text-gray-400 hover:text-emerald-400 hover:bg-white/5 rounded-md transition-all text-sm uppercase tracking-wide">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" color="#3e9212" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user-round-arrow-left-icon lucide-user-round-arrow-left"><path d="m19 16-3 3"/><path d="M2 21a8 8 0 0 1 12.664-6.5"/><path d="M22 19h-6l3 3"/><circle cx="10" cy="8" r="5"/></svg> <span>Mi Perfil</span>
      </a>

      <div class="opacity-40 transition-opacity group relative">
        <a class="flex items-center gap-4 px-4 py-3 text-gray-500 cursor-not-allowed text-sm uppercase tracking-wide">
          <svg xmlns="http://www.w3.org/2000/svg"  color="#3e9212" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-mail-icon lucide-mail"><path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg> <span>Mensajes</span>
          <span class="absolute right-3 text-[9px] font-mono text-emerald-600 border border-emerald-950 px-1 rounded bg-black/40">🔒</span>
        </a>
      </div>

      <div class="opacity-40 transition-opacity group relative">
        <a class="flex items-center gap-4 px-4 py-3 text-gray-500 cursor-not-allowed text-sm uppercase tracking-wide">
          <svg xmlns="http://www.w3.org/2000/svg" color="#3e9212" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-settings-icon lucide-settings"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg> <span>Ajustes</span>
          <span class="absolute right-3 text-[9px] font-mono text-emerald-600 border border-emerald-950 px-1 rounded bg-black/40">🔒</span>
        </a>
      </div>

      <div class="opacity-40 transition-opacity">
        <a class="flex items-center gap-4 px-4 py-3 text-gray-500 cursor-not-allowed text-sm uppercase tracking-wide">
          <svg xmlns="http://www.w3.org/2000/svg"  color="#3e9212" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-monitor-play-icon lucide-monitor-play"><path d="M15.033 9.44a.647.647 0 0 1 0 1.12l-4.065 2.352a.645.645 0 0 1-.968-.56V7.648a.645.645 0 0 1 .967-.56z"/><path d="M12 17v4"/><path d="M8 21h8"/><rect x="2" y="3" width="20" height="14" rx="2"/></svg> <span>Biblioteca Top 10</span>
        </a>
      </div>

      @if (authService.esAdmin) {
        <div class="mt-4 pt-4 border-t border-white/5 space-y-1">
          <p class="text-[9px] text-red-600 font-black uppercase tracking-widest mb-2 px-4">Consola Maestra</p>

          <a routerLink="/home/dashboard/estadisticas"
             routerLinkActive="text-purple-400 font-bold bg-purple-950/20 border-l-2 border-purple-500 rounded-r-md"
             class="flex items-center gap-4 px-4 py-2.5 text-purple-400/80 hover:text-purple-400 hover:bg-purple-950/10 rounded-md transition-all text-xs uppercase tracking-wide">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chart-no-axes-combined-icon lucide-chart-no-axes-combined"><path d="M12 16v5"/><path d="M16 14.639V21"/><path d="M20 10.656V21"/><path d="m22 3-8.646 8.646a.5.5 0 0 1-.708 0L9.354 8.354a.5.5 0 0 0-.707 0L2 15"/><path d="M4 18.463V21"/><path d="M8 14.656V21"/></svg> <span>Estadísticas Ocultas</span>
          </a>

          <a routerLink="/home/dashboard/usuarios"
             routerLinkActive="text-purple-400 font-bold bg-purple-950/20 border-l-2 border-purple-500 rounded-r-md"
             class="flex items-center gap-4 px-4 py-2.5 text-purple-400/80 hover:text-purple-400 hover:bg-purple-950/10 rounded-md transition-all text-xs uppercase tracking-wide">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shield-cog-corner-icon lucide-shield-cog-corner"><path d="M11 22c-3.806-1.45-7-3.966-7-9V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1v4"/><path d="M14.923 16.547 14 16.164"/><path d="m14.923 18.843-.923.383"/><path d="M16.547 14.923 16.164 14"/><path d="m16.547 20.467-.383.924"/><path d="m18.843 14.923.383-.923"/><path d="m19.225 21.391-.382-.924"/><path d="m20.467 16.547.923-.383"/><path d="m20.467 18.843.923.383"/><circle cx="17.695" cy="17.695" r="3"/></svg> <span>Control Usuarios</span>
          </a>
        </div>
      }

    </nav>
  </div>

  <div class="space-y-3 pt-4 border-t border-white/5">

    <div class="flex items-center gap-3 p-2.5 bg-black/40 backdrop-blur-sm rounded-lg border border-white/5">
      <div class="w-9 h-9 rounded-full bg-zinc-900 border border-emerald-500/30 flex items-center justify-center font-bold text-emerald-400 overflow-hidden shrink-0 shadow-[0_0_8px_rgba(16,185,129,0.1)]">
        @if (currentUser?.avatarUrl) {
          <img [src]="currentUser!.avatarUrl | imagenMedia" class="w-full h-full object-cover" alt="Avatar">
        } @else {
          <span class="text-xl">👁️</span>
        }
      </div>

      <div class="truncate">
        <p class="text-xs font-bold text-gray-200 truncate">{{ currentUser?.nombreUsuario || 'Investigador' }}</p>
        <p class="text-[9px] font-mono text-gray-500 uppercase tracking-tight">{{currentUser?.perfil}}</p>
      </div>
    </div>

    <audio #reproductorLluvia src="assets/sounds/feed.mp3" loop preload="auto"></audio>

    <button (click)="alternarSilencioAudio()"
            class="w-full py-2 px-3 bg-black/20 hover:bg-white/5 border text-left rounded-lg transition-all duration-300 cursor-pointer flex items-center justify-between text-xs font-mono group"
            [class.border-emerald-500/10]="!audioMutado()"
            [class.text-emerald-400]="!audioMutado()"
            [class.border-white/5]="audioMutado()"
            [class.text-gray-500]="audioMutado()">

      <span class="tracking-wider uppercase text-[9px]">
        {{ audioMutado() ? 'Canal Aislado' : 'Frecuencia Ambiente' }}
      </span>

      @if (audioMutado()) {
        <span class="text-xs text-red-500/60 animate-pulse transition-transform">MUTE</span>
      } @else {
        <span class="text-xs text-emerald-500 group-hover:animate-bounce transition-transform">🌧️</span>
      }
    </button>

  </div>
</div>
