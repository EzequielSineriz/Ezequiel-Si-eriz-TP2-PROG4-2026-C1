<div class="p-4 border-b border-white/10 bg-black/40 backdrop-blur-sm">
  <form [formGroup]="postForm" (ngSubmit)="enviarPost()" class="flex gap-3">

    <!-- Círculo del Avatar Adaptativo -->
    <div class="w-10 h-10 rounded-full bg-emerald-950 border border-emerald-500/30 flex items-center justify-center font-bold text-emerald-400 shrink-0 overflow-hidden">
      @switch (postForm.get('categoria')?.value) {
        @case ('ovnis') {
          <app-scary-ufo-icon [size]="26"></app-scary-ufo-icon>
        }
        @case ('fantasmas') {
          <app-scary-ghost-icon [size]="24" color="#a7f3d0" eyeColor="#ef4444"></app-scary-ghost-icon>
        }
        @case ('mitologia') {
          <app-scary-myth-icon [size]="26"></app-scary-myth-icon>
        }
        @case ('general') {
          <app-scary-general-icon [size]="24"></app-scary-general-icon>
        }
        @default {
          <span class="text-xs text-zinc-600">💀</span>
        }
      }
    </div> <!-- ¡Cierre del círculo corregido aquí! -->

    <div class="w-full space-y-3">
      <textarea
        formControlName="contenido"
        class="w-full bg-transparent border-none text-gray-200 placeholder-gray-500 focus:outline-none resize-none text-sm font-body"
        placeholder="¿Qué avistamiento paranormal presenciaste hoy...?"
        rows="3"></textarea>

      @if (imagenPreview) {
        <div class="relative inline-block rounded-lg overflow-hidden border border-emerald-500/50 max-h-60 asset-preview">
          <img [src]="imagenPreview" class="max-h-60 object-cover rounded-lg" alt="Preview" />
          <button
            type="button"
            (click)="quitarImagen()"
            class="absolute top-2 right-2 bg-black/70 hover:bg-red-600 text-white rounded-full p-1.5 transition-colors cursor-pointer text-xs">
            ✕
          </button>
        </div>
      }

      <div class="flex flex-wrap justify-between items-center border-t border-white/5 pt-2 gap-2">
        <div class="flex items-center gap-3">
          <select formControlName="categoria"
                  class="bg-zinc-900 border border-emerald-500/30 text-emerald-400 text-xs rounded px-2 py-1 focus:outline-none focus:border-emerald-500 font-body">
            @for (cat of categorias; track cat.id) {
              <option [value]="cat.id">{{ cat.nombre }}</option>
            }
          </select>

          <label class="flex items-center gap-1 text-xs text-gray-400 hover:text-emerald-400 cursor-pointer transition-colors">
            <input
              type="file"
              accept="image/*"
              class="hidden"
              (change)="onFileSelected($event)">
              <svg xmlns="http://www.w3.org/2000/svg" color="#10b981" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-image-plus-icon lucide-image-plus"><path d="M16 5h6"/><path d="M19 2v6"/><path d="M21 11.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7.5"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/><circle cx="9" cy="9" r="2"/></svg>
             <span> Adjuntar Evidencia</span>
          </label>
        </div>

        <button type="submit"
                [disabled]="postForm.invalid"
                class="bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 text-white font-bold text-xs uppercase tracking-widest px-4 py-2 rounded-full transition-all shadow-[0_0_10px_rgba(16,185,129,0.3)] cursor-pointer">
          Publicar
        </button>
      </div>
    </div>
  </form>
</div>
